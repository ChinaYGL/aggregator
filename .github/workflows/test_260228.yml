name: Get Subscription Weekly

on:
  schedule:
    - cron: '0 16 * * 6'  # 北京时间每周日凌晨执行
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  execute-script:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        pip3 install pyYAML requests
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Collect Subscribe
      id: collect
      run: |
        python -u subscribe/collect.py

    - name: Debug - List Files
      run: |
        echo "Listing all files in workspace recursively:"
        ls -R
      
    - name: Create/Update Gist
      env:
        GH_TOKEN: ${{ secrets.GIST_PAT }}
      run: |
        cd data
        # 检查文件是否存在，如果存在则更新 Gist
        [ -f "clash.yaml" ] && gh gist edit ${{ secrets.GIST_LINK }} --add "clash.yaml"
        [ -f "subscribes.txt" ] && gh gist edit ${{ secrets.GIST_LINK }} --add "subscribes.txt"
        [ -f "domains.txt" ] && gh gist edit ${{ secrets.GIST_LINK }} --add "domains.txt"
        [ -f "valid-domains.txt" ] && gh gist edit ${{ secrets.GIST_LINK }} --add "valid-domains.txt"
        echo "Gist update completed (if files existed)."
